name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Both platforms finish in well under a minute. Without a cap, a test that
    # blocks on a GUI dialog burns the full 6h job limit on every push.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 fonts-dejavu-core
          # test_shipped_default_actually_applies_the_bundled_font renders once
          # with the bundled @font-face stripped, forcing Pango to fall back to
          # a system font. With zero fonts installed, Pango segfaults instead
          # of erroring (a known Pango/fontconfig failure mode) - this package
          # just needs to exist, its metrics are never asserted on.
          fc-list | wc -l
      - name: Install Pango for WeasyPrint (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-pango
          echo WEASYPRINT_DLL_DIRECTORIES=C:\msys64\mingw64\bin>> %GITHUB_ENV%
      - run: pip install -r requirements.txt
      - run: pytest -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
