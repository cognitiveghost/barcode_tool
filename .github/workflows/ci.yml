name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Both platforms finish in well under a minute. Without a cap, a test that
    # blocks on a GUI dialog burns the full 6h job limit on every push.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0
      - name: Install Pango for WeasyPrint (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-pango
          echo WEASYPRINT_DLL_DIRECTORIES=C:\msys64\mingw64\bin>> %GITHUB_ENV%
      - run: pip install -r requirements.txt
      - name: Run WeasyPrint's font-swap test in isolation (Linux)
        if: runner.os == 'Linux'
        # WeasyPrint/Pango's font-map cache carries state across renders in
        # the same process. This test renders once with the bundled font,
        # then again with none - by the time the full suite (dozens of
        # prior renders) reaches it, that accumulated state segfaults the
        # process on ubuntu-latest. Verified: passes standalone, and passes
        # on Windows even mid-suite - only crashes here once wedged between
        # many prior renders. Its own pytest process sidesteps the shared
        # cache without skipping the test itself.
        run: pytest -v -k test_shipped_default_actually_applies_the_bundled_font
      - name: Run the rest of the suite (Linux)
        if: runner.os == 'Linux'
        run: pytest -v -k "not test_shipped_default_actually_applies_the_bundled_font"
      - name: Run the suite (Windows)
        if: runner.os == 'Windows'
        run: pytest -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .
